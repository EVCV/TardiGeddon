name: Android app

# Every push: a debug APK to try on an emulator or phone (docs/APPS.md).
# On main (and when run by hand), once the upload key is in the repository's
# secrets (docs/GOOGLE_PLAY.md): a signed .aab for Google Play, and a signed
# APK that installs over the previous one. On main, once the Play service
# account is in the secrets too, the .aab goes straight to Google Play's
# internal testing track (fastlane, android/fastlane/), as iOS goes to TestFlight.
on:
  push:
    paths:
      - 'android/**'
      - 'src/**'
      - 'public/**'
      - 'capacitor.config.ts'
      - '.env.app'
      - 'package*.json'
      - '.github/workflows/android.yml'
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci
      - run: npm run app:build
      - run: ./gradlew assembleDebug
        working-directory: android
      - uses: actions/upload-artifact@v6
        with:
          name: tardigeddon-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk

  release:
    if: github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    env:
      HAS_KEY: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
      # Uploads to Google Play only from main, and only once its key is set up.
      UPLOAD_TO_PLAY: ${{ github.ref == 'refs/heads/main' && secrets.ANDROID_KEYSTORE_BASE64 != '' && secrets.PLAY_SERVICE_ACCOUNT_JSON != '' }}
    steps:
      - name: Upload key not set up yet
        if: env.HAS_KEY != 'true'
        run: echo "::notice::No ANDROID_KEYSTORE_BASE64 secret yet, so no signed build (see docs/GOOGLE_PLAY.md)."
      - name: Google Play upload not set up yet
        if: env.HAS_KEY == 'true' && env.UPLOAD_TO_PLAY != 'true' && github.ref == 'refs/heads/main'
        run: echo "::notice::No PLAY_SERVICE_ACCOUNT_JSON secret yet, so the .aab isn't uploaded to Google Play (see docs/GOOGLE_PLAY.md §5)."
      - uses: actions/checkout@v5
        if: env.HAS_KEY == 'true'
      - uses: actions/setup-node@v5
        if: env.HAS_KEY == 'true'
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v5
        if: env.HAS_KEY == 'true'
        with:
          distribution: temurin
          java-version: 21
      - if: env.HAS_KEY == 'true'
        run: npm ci && npm run app:build
      - name: Signed .aab and .apk
        if: env.HAS_KEY == 'true'
        working-directory: android
        env:
          ANDROID_KEYSTORE_FILE: ${{ runner.temp }}/upload.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          # Google Play needs a bigger number for every upload.
          ANDROID_VERSION_CODE: ${{ github.run_number }}
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$ANDROID_KEYSTORE_FILE"
          ./gradlew bundleRelease assembleRelease
          rm -f "$ANDROID_KEYSTORE_FILE"
      - name: Check both are signed with the upload key
        if: env.HAS_KEY == 'true'
        working-directory: android/app/build/outputs
        run: |
          # An unsigned .aab would only be caught by Google Play: fail here instead.
          jarsigner -verify bundle/release/app-release.aab | tee /dev/stderr | grep -q 'jar verified'
          APKSIGNER=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          "$APKSIGNER" verify --print-certs apk/release/app-release.apk
      - uses: actions/upload-artifact@v6
        if: env.HAS_KEY == 'true'
        with:
          name: tardigeddon-release-${{ github.run_number }}
          path: |
            android/app/build/outputs/bundle/release/app-release.aab
            android/app/build/outputs/apk/release/app-release.apk
      - uses: ruby/setup-ruby@v1
        if: env.UPLOAD_TO_PLAY == 'true'
        with:
          ruby-version: '3.3'
          bundler-cache: true
          working-directory: android
      - name: Upload to Google Play (internal testing)
        if: env.UPLOAD_TO_PLAY == 'true'
        working-directory: android
        env:
          LC_ALL: en_US.UTF-8
          LANG: en_US.UTF-8
          FASTLANE_SKIP_UPDATE_CHECK: '1'
          PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
        run: bundle exec fastlane internal
