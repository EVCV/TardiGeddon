name: Android app

# Builds a debug APK (docs/APPS.md): download it from the run's "Artifacts"
# and install it on an emulator or a phone. Not signed for Google Play.
on:
  push:
    paths:
      - 'android/**'
      - 'src/**'
      - 'public/**'
      - 'capacitor.config.ts'
      - '.env.app'
      - 'package*.json'
      - '.github/workflows/android.yml'
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci
      - run: npm run app:build
      - run: ./gradlew assembleDebug
        working-directory: android
      - uses: actions/upload-artifact@v4
        with:
          name: tardigeddon-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
