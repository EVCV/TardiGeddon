name: Store images

# By hand (Actions → Store images → Run workflow): the store listings' pictures
# in every language (docs/STORE_LISTING.md), as a zip to download from the run.
# Only English is kept in the repo; the rest would add ~60 MB each time.
on:
  workflow_dispatch:
    inputs:
      langs:
        description: 'Languages, space-separated (blank: all six)'
        required: false
        default: ''

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      # Japanese headlines (the title font has no kana).
      - run: sudo apt-get install -y fonts-ipafont-gothic
      - run: npm run build
      - name: Serve the game
        run: |
          npx vite preview --port 4173 --strictPort &
          for i in $(seq 60); do curl -sf http://localhost:4173/ >/dev/null && exit 0; sleep 1; done
          exit 1
      - name: Make the pictures
        env:
          LANGS: ${{ inputs.langs }}
        run: npx tsx scripts/store-art.ts $LANGS
      - uses: actions/upload-artifact@v6
        with:
          name: store-listing
          path: store/listing/*/
