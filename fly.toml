# Fly.io config for the online game server (see docs/ONLINE.md).
# Change `app` to the name you create with `fly launch`/`fly apps create`.
app = "tardigeddon-server"
primary_region = "lhr"
# On a deploy or restart the server gets this signal, saves the last minute's
# anonymous play counts, and exits (server/main.ts); after kill_timeout
# seconds it is stopped regardless.
kill_signal = "SIGTERM"
kill_timeout = 10

[build]

[http_service]
  internal_port = 8787
  force_https = true
  # Rooms live in memory: keep exactly one machine running.
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

[[vm]]
  memory = "512mb"
  cpu_kind = "shared"
  cpus = 1
